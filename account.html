<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Account Dashboard - Lanta Xpress</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Dashboard responsive layout and styles inspired by the provided screenshot */
    :root { --dash-bg: #f6f8fa; --card-bg: #fff; --accent: #00886a; --accent-2: #3dbb8d; --muted:#6b7280; --shadow: 0 6px 18px rgba(0,136,106,0.08); }
    html,body{height:100%;}
    body { margin:0; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--dash-bg); color:#111827; }
    header.header{background:var(--accent);padding:1rem 1.25rem;border-bottom:1px solid rgba(0,0,0,0.04);color:#fff}
    header.header .brand-name, header.header .header-icons, header.header .nav a{color:#fff}
    /* remove white frame so header appears as a plain green bar */
    header.header .logo{background:transparent;padding:0;border-radius:8px}
    .menu-btn{background:transparent;border:0;color:#fff;font-size:20px;padding:6px 8px;border-radius:6px}
    .nav a{color:inherit}
    .logo-area{display:flex;align-items:center;gap:.6rem}
    .logo{width:48px;height:48px;border-radius:8px;object-fit:cover}
    .brand-name{font-weight:700;color:var(--muted)}
    .container{max-width:1200px;margin:1.25rem auto;padding:0 1rem}

    /* Two-column layout: left sidebar, right content */
    .ax-layout{display:flex;gap:1.25rem;align-items:flex-start}
    .ax-sidebar{width:260px;background:var(--card-bg);padding:1rem;border-radius:14px;box-shadow:var(--shadow);height:calc(100vh - 120px);overflow:auto;position:sticky;top:20px}
    .ax-main{flex:1}

    /* Top welcome header inside main area */
    .ax-topbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    .ax-welcome{font-size:28px;font-weight:800;color:#0f172a}
    .ax-actions input{padding:.6rem .8rem;border-radius:10px;border:1px solid #e6eef6;min-width:220px}

    /* Big vertical cards matching screenshot */
    .ax-cards{display:flex;flex-direction:column;gap:1rem;margin-bottom:1rem}
    .ax-card{display:flex;align-items:center;gap:1rem;background:var(--card-bg);padding:1.2rem;border-radius:14px;border-top:6px solid var(--accent);box-shadow:var(--shadow)}
    .ax-card .ax-icon{width:56px;height:56px;background:rgba(0,136,106,0.06);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:22px}
    .ax-card-title{font-size:0.92rem;color:var(--muted);font-weight:600}
    .ax-card-value{font-size:18px;font-weight:600;color:#0f172a;margin-bottom:.2rem}
    .ax-card .ax-icon svg{display:block;max-width:28px;max-height:28px}
    .ax-card-action .ax-link {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .ax-card-action .ax-link:hover { text-decoration: underline; }

    /* Sections and tables */
    .ax-sections{margin-top:0}
    .ax-section{background:transparent;padding:0}
    .ax-table{width:100%;border-collapse:collapse;background:var(--card-bg);border-radius:10px;overflow:hidden}
    .ax-table th,.ax-table td{padding:.85rem;border-bottom:1px solid #f3f4f6}

    /* Sidebar nav styles */
    .ax-side-nav ul{list-style:none;padding:0;margin:0}
    .ax-side-nav li{margin:0}
    .ax-side-nav a{display:flex;align-items:center;gap:.6rem;padding:.6rem;border-radius:10px;color:#0f172a;text-decoration:none}
    .ax-side-nav a:hover{background:rgba(0,136,106,0.04)}
    .ax-side-nav a.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#fff}
    .ax-side-sub{padding-left:.6rem;margin-top:.25rem}

    /* Responsive: tablet and below stack sidebar on top */
    @media (max-width:1024px){ .container{max-width:960px} .ax-sidebar{width:240px;height:auto;position:relative;top:auto} }
    @media (max-width:800px){ .ax-layout{flex-direction:column} .ax-sidebar{width:100%;height:auto;position:relative} .ax-welcome{font-size:22px} .ax-cards{flex-direction:row;flex-wrap:wrap} .ax-card{flex:1 1 48%} }
      /* On small screens hide the sidebar by default and let the header hamburger toggle it */
      @media (max-width:800px) {
        .ax-sidebar { display: none; }
        .ax-layout.ax-sidebar-open .ax-sidebar { display: block; }
        /* when sidebar opens, push main content below for clarity */
        .ax-layout.ax-sidebar-open .ax-main { margin-top: 0.75rem; }
      }
    @media (max-width:480px){ .ax-card{flex:1 1 100%} .ax-welcome{font-size:18px} .ax-actions input{min-width:120px} }
    /* On account page we don't want the header dropdown menu to appear as a green board on mobile */
    @media (max-width:600px) {
      .nav ul { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo-area"><img src="assets/lantalogo2.jpg" alt="Lanta" class="logo"><span class="brand-name">LantaXpress</span></div>
    <nav class="nav"><ul id="main-menu"><li><a href="index.html">Home</a></li><li><a href="items.html">Items</a></li></ul></nav>
    <div class="header-icons"><button class="menu-btn" aria-label="Toggle menu">☰</button></div>
  </header>

  <main class="container">
    <div id="account-dashboard" class="ax-layout">
      <aside class="ax-sidebar">
        <button class="ax-sidebar-toggle">Toggle</button>
        <!-- Sidebar items inserted by script -->
      </aside>
      <section class="ax-main">
        <!-- Main content injected by script -->
      </section>
    </div>
  </main>

  <script src="script.js"></script>
  <nav class="mobile-bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon"> 
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00886a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3l9 9"/><path d="M9 21V9h6v12"/></svg>
      </span>
      <span class="nav-label">Home</span>
    </a>
    <a href="items.html" class="nav-item">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00886a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </span>
      <span class="nav-label">Items</span>
    </a>
    <a href="logistics.html" class="nav-item">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00886a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      </span>
      <span class="nav-label">Logistics</span>
    </a>
    <a href="account.html" class="nav-item active">
      <span class="nav-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00886a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a8.38 8.38 0 0 1 13 0"/></svg>
      </span>
      <span class="nav-label">Account</span>
    </a>
  </nav>
</body>
</html>
